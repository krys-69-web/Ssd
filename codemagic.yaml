workflows:
  android-workflow:
    name: Infinite Stretch Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 21
      vars:
        PACKAGE_NAME: "com.aistudio.slmstretch.krvxpm"

    scripts:
      - name: Set up Gradlew execute permissions
        script: |
          chmod +x gradlew

      - name: Restore Debug Keystore
        script: |
          echo "Restoring debug.keystore..."
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore || base64 -d debug.keystore.base64 > debug.keystore
            echo "Keystore restored successfully: $(ls -l debug.keystore)"
          else
            echo "debug.keystore.base64 not found!"
            ls -la
            exit 1
          fi

      - name: Run Android Unit Tests
        script: |
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Android APK
        script: |
          ./gradlew :app:assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - ton-email@example.com
          - yjoanchris225@gmail.com
        notify:
          success: true
          failure: true
