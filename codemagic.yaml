workflows:
  android-workflow:
    name: Infinite Stretch Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 21
      vars:
        PACKAGE_NAME: "com.aistudio.slmstretch.krvxpm"

    scripts:
      - name: Set up Gradlew execute permissions
        script: |
          chmod +x gradlew

      - name: Restore Debug Keystore
        script: |
          echo "Setting up debug.keystore..."
          if [ -f debug.keystore.base64 ]; then
            base64 -D debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -d debug.keystore.base64 > debug.keystore
            echo "Keystore restored from base64 file"
          else
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Keystore generated successfully"
          fi
          ls -l debug.keystore

      - name: Run Android Unit Tests
        script: |
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Android APK
        script: |
          ./gradlew :app:assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - yjoanchris225@gmail.com
        notify:
          success: true
          failure: true
